server.port: 8083
spring:
 application.name: appointment-service
 datasource:
  url: ${DB_URL:jdbc:postgresql://localhost:5432/appointment_db}
  username: ${POSTGRES_USER:clinic}
  password: ${POSTGRES_PASSWORD:clinic_password}
 jpa:
  hibernate.ddl-auto: validate
  open-in-view: false
 flyway.enabled: true
clients:
 doctor-service-url: ${DOCTOR_SERVICE_URL:http://localhost:8082}
 ai-service-url: ${AI_SERVICE_URL:http://localhost:8084}
 notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
app:
 internal-api-key: ${INTERNAL_API_KEY:replace-with-a-second-long-random-secret}
 clinic-zone: ${CLINIC_TIMEZONE:Asia/Kolkata}
 outbox-delay-ms: 5000
management.endpoints.web.exposure.include: health,info
