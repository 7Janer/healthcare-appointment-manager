server.port: ${PORT:8085}
spring:
 application.name: notification-service
 datasource:
  url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}}
  username: ${POSTGRES_USER:clinic}
  password: ${POSTGRES_PASSWORD:clinic_password}
 jpa:
  hibernate.ddl-auto: validate
  open-in-view: false
 flyway.enabled: true
 mail:
  host: ${SMTP_HOST:localhost}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  from: ${SMTP_FROM:no-reply@clinic.local}
  properties.mail.smtp:
   auth: true
   starttls.enable: true
notifications:
 smtp-enabled: ${SMTP_ENABLED:false}
 dry-run: ${NOTIFICATION_DRY_RUN:true}
 worker-delay-ms: 10000
 medication-delay-ms: 30000
google:
 client-id: ${GOOGLE_CLIENT_ID:}
 client-secret: ${GOOGLE_CLIENT_SECRET:}
 redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/calendar/oauth/callback}
 frontend-success-uri: ${GOOGLE_FRONTEND_SUCCESS_URI:http://localhost:5173/calendar-connected}
app.internal-api-key: ${INTERNAL_API_KEY:replace-with-a-second-long-random-secret}
management.endpoints.web.exposure.include: health,info
spring.jpa.properties.hibernate.default_schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:public}
management.health.mail.enabled: false
