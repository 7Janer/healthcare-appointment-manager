server.port: ${PORT:8081}
spring:
  application.name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}}
    username: ${POSTGRES_USER:clinic}
    password: ${POSTGRES_PASSWORD:clinic_password}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway.enabled: true
security.jwt:
  secret: ${JWT_SECRET:replace-with-a-long-random-256-bit-secret}
  ttl-hours: 12
app.admin:
  email: ${ADMIN_EMAIL:admin@clinic.local}
  password: ${ADMIN_PASSWORD:ChangeMe123!}
management.endpoints.web.exposure.include: health,info
spring.jpa.properties.hibernate.default_schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:public}
